name: AI PR Description Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  generate-description:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate and Update PR Description
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"

          # Fetch the diff and ignore common large auto-generated files to save tokens
          DIFF=$(git diff "origin/${{ github.event.pull_request.base.ref }}...HEAD" -- . ':!.github/workflows/*' ':!.husky/*' ':!*agent*' ':!package-lock.json' ':!*.lock')

          if [ -z "$DIFF" ]; then
            echo "No changes found in diff."
            exit 0
          fi

          SYSTEM_PROMPT=$(cat <<'PROMPT'
          You are an expert Full-Stack Software Engineer acting as a Pull Request reviewer and documentation generator. Analyze the provided code diffs and generate a structured Pull Request description matching the repository template.

          Output MUST strictly follow this Markdown structure:

          ## Description
          - Provide a detailed overview of the code changes and how they work.
          - Explain key technical decisions, architectural patterns, and interactions across the stack (React, Node/Express, PostgreSQL, etc.).

          ## Context
          - Explain why this change is necessary and what problem it solves.
          - Include ticket/issue linking (e.g., 'Closes #' or 'Relates to #').
          - Highlight any breaking changes, dependencies, or notable risks (or state 'No major risks identified').

          ## How has this been tested?
          - Describe testing methodology, testing environment (e.g., Node version, OS), and tools used (e.g., Jest, Supertest, manual verification).
          - Provide step-by-step instructions to pull the branch and verify locally.

          ## Screenshots (if appropriate):
          - If frontend UI changes were made, output: **[Insert Screenshots/Screen Recording Here]**
          - If changes are backend/CLI-only with no UI impact, output: N/A

          Additional constraints:
          - COMPLETELY IGNORE any changes made to workflow automation files (.github/workflows/) or AI agent configurations (.husky/, .agents/). Do not mention them in the generated description.
          - Output ONLY the raw Markdown starting directly with '## Description'. Do not include preamble or conversational filler.
          PROMPT
          )

          PR_DESCRIPTION=""
          
          # Export to bypass Linux argument length limits in jq
          export SYSTEM_PROMPT
          export DIFF

          call_gemini() {
            local max_attempts=3
            local attempt=1
            local response
            local http_code
            local body
            local request_body

            request_body=$(jq -n -c \
              '{
                contents: [{
                  parts: [
                    {text: env.SYSTEM_PROMPT},
                    {text: "\n\nHere is the diff to analyze:\n"},
                    {text: env.DIFF}
                  ]
                }]
              }')

            while [ "$attempt" -le "$max_attempts" ]; do
              response=$(curl -sS -w $'\n%{http_code}' -X POST \
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent" \
                -H "Content-Type: application/json" \
                -H "x-goog-api-key: ${GEMINI_API_KEY}" \
                -d "$request_body") || response=$'\n000'

              http_code="${response##*$'\n'}"
              body="${response%$'\n'*}"

              if [ "$http_code" = "200" ]; then
                PR_DESCRIPTION=$(jq -r '.candidates[0].content.parts[0].text // empty' <<< "$body")
                if [ -n "$PR_DESCRIPTION" ]; then
                  echo "PR description generated with Gemini."
                  return 0
                fi
              fi

              echo "Gemini attempt ${attempt}/${max_attempts} failed with HTTP ${http_code}."

              if [[ "$http_code" =~ ^(429|500|502|503|504)$ ]] && [ "$attempt" -lt "$max_attempts" ]; then
                sleep $((5 * 2 ** (attempt - 1)))
                attempt=$((attempt + 1))
              else
                echo "Gemini response: $body"
                return 1
              fi
            done

            return 1
          }

          call_openrouter() {
            local response
            local http_code
            local body
            local or_model="meta-llama/llama-3.1-8b-instruct:free"
            local request_body
            local or_diff

            or_diff="$DIFF"
            
            if [ "${#or_diff}" -gt 20000 ]; then
              echo "Diff is large; truncating OpenRouter fallback input."
              or_diff="${or_diff:0:20000}

          [Diff truncated for fallback due to provider limits.]"
            fi
            
            export OR_DIFF="$or_diff"

            request_body=$(jq -n -c \
              --arg model "$or_model" \
              '{
                model: $model,
                messages: [
                  {
                    role: "system",
                    content: env.SYSTEM_PROMPT
                  },
                  {
                    role: "user",
                    content: "\n\nHere is the diff to analyze:\n\(env.OR_DIFF)"
                  }
                ]
              }')
            
            response=$(curl -sS -w $'\n%{http_code}' -X POST \
              "https://openrouter.ai/api/v1/chat/completions" \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${OPENROUTER_API_KEY}" \
              -d "$request_body") || response=$'\n000'

            http_code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            
            if [ "$http_code" = "200" ]; then
              PR_DESCRIPTION=$(jq -r '.choices[0].message.content // empty' <<< "$body")
            
              if [ -n "$PR_DESCRIPTION" ]; then
                echo "PR description generated with OpenRouter fallback (${or_model})."
                return 0
              fi
            fi
            
            echo "OpenRouter fallback failed with HTTP ${http_code}."
            echo "OpenRouter response: $body"
            return 1
          }
            
          if ! call_gemini; then
            echo "Gemini unavailable. Falling back to OpenRouter..."
            if ! call_openrouter; then
              echo "All AI providers failed. PR description was not generated."
              exit 1
            fi
          fi

          printf '%s\n' "$PR_DESCRIPTION" > pr-description.md
          gh pr edit "${{ github.event.pull_request.number }}" --body-file pr-description.md
